services:
  nginx:
    image: nginx:1.26.2
    ports:
      - "80:80" # Expose port 80 for HTTP
      - "443:443" # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Mount custom Nginx configuration
    depends_on:
      - frontend
      - backend
    networks:
      - mern-app

  frontend:
    build:
      context: ./client/sotl
      dockerfile: Dockerfile
    stdin_open: true
    ports:
      - "3000:80"
    restart: always
    volumes:
      - ./client/sotl/src:/app/src
      - ./client/sotl/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - JWT_SECRET=3JcVf2R5mQj8L16xL1gD4G5n/9b8b9q4n6Y8JkN6D1c=
      - ENCRYPTION_KEY=802d570dc8423661e65cf090abba4274418eff4aa5dc6cb85d6c20f8843d26b3
    networks:
      - mern-app

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    restart: always
    environment:
      - BACKEND_PORT=5000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=text-bison-001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo_primary:27017,mongo_secondary:27019/?replicaSet=rs0
      - JWT_SECRET=3JcVf2R5mQj8L16xL1gD4G5n/9b8b9q4n6Y8JkN6D1c=
      - ENCRYPTION_KEY=802d570dc8423661e65cf090abba4274418eff4aa5dc6cb85d6c20f8843d26b3
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=gorilajaker456@gmail.com
      - SMTP_PASS=uyewmupfxohbgpcc
      - WEBSITE_URL=http://localhost:3000
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - mern-app
    depends_on:
      - mongo_primary
      - mongo_secondary
    command: npm run dev

  mongo_primary:
    image: mongo:7.0.12
    ports:
      - "27017:27017"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017',priority:1},{_id:1,host:'host.docker.internal:27019',priority:0.5}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30
    restart: always
    networks:
      - mern-app
    volumes:
      - mongo-data-primary:/data/db
      - mongo-data-primary-config:/data/configdb
    command: >
      mongod --replSet rs0 --bind_ip_all --port 27017

  mongo_secondary:
    image: mongo:7.0.12
    ports:
      - "27019:27019"
    restart: always
    networks:
      - mern-app
    volumes:
      - mongo-data-secondary:/data/db
      - mongo-data-secondary-config:/data/configdb
    command: >
      mongod --replSet rs0 --bind_ip_all --port 27019

  redis:
    image: redis:7.2.6
    ports:
      - "6379:6379"
    restart: always
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - mern-app

networks:
  mern-app:
    driver: bridge

volumes:
  mongo-data-primary:
    driver: local
  mongo-data-secondary:
    driver: local
  mongo-data-primary-config:
  mongo-data-secondary-config: