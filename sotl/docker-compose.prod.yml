# docker-compose.yml
services:
  frontend:
    build:
      context: ./client/sotl
      dockerfile: Dockerfile
      target: production
    stdin_open: true
    ports:
      - "3000:80"
    restart: always
    networks:
      - mern-app

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - BACKEND_PORT=5000
    restart: always
    networks:
      - mern-app
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    restart: always
    networks:
      - mern-app
    volumes:
      - mongo-data:/data/db
  
  redis:
    image: redis:latest
    restart: always
    networks:
      - mern-app

networks:
  mern-app:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  
